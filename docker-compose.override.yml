# Development overrides, applied automatically by `docker compose up`.
# Everything here is deliberately absent from the production images.
services:
  db:
    # Exposed for local inspection with a MySQL client. Never published on a NAS.
    ports:
      - "3306:3306"

  api:
    # Adds pytest and friends; the production image has neither.
    build:
      context: ./backend
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # The Vite dev server is a different origin; production is same-origin (D9).
      CORS_ORIGIN_REGEX: "http://(localhost|127\\.0\\.0\\.1)(:\\d+)?"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
