server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the worker or the manifest: a stale service worker pins clients
    # to an old build until they clear site data.
    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /push-sw.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Vite fingerprints these, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API (D9). The trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
